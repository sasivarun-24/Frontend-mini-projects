<div class="counter-container">
    <h2>Counter</h2>
    <div class="counter-display">
        <p>Count: {{ count() }}</p>
        <p>Is even number: {{ isEven() }}</p>
    </div>
    <div class="counter-controls">
        <button mat-raised-button color="primary" (click)="increase()">Increase</button>
        <button mat-raised-button color="accent" (click)="decrease()">Decrease</button>
    </div>
</div>
