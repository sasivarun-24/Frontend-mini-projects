<div class="container" style="padding: 20px;">
    <h3>Material Users</h3>

    <table mat-table [dataSource]="users" class="mat-elevation-z8">

        <!-- Name Column -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> User </th>
            <td mat-cell *matCellDef="let user"> {{user.name}} </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Details | Edit | Delete </th>
            <td mat-cell *matCellDef="let user">
                <a mat-raised-button color="primary" [routerLink]="['/user', user.id]">Details</a>
                <a mat-raised-button color="accent" [routerLink]="['/material-user-edit', user.id]"
                    style="margin-left: 8px;">Edit</a>
                <button mat-raised-button color="warn" style="margin-left: 8px;">Delete</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
