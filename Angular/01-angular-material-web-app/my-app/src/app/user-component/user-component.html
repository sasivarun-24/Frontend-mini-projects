@if (user) {
<div class="user-card">
    <h3>User: {{ user.name }}</h3>
    <p>Phone: {{ user.telephone }}</p>
    <p>Email: {{ user.email }}</p>
    <p>Address: {{ user.address.street }}, {{ user.address.postalCode }} {{ user.address.city }}</p>
</div>
} @else {
<p>User not found or no ID provided.</p>
}
